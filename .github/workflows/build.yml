name: Build NutriBadik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Скачивание кода
        uses: actions/checkout@v4

      - name: 2. Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Создание проекта и поиск index.html
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/java/com/scimacro/nutribadik
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/mipmap-hdpi

          # Автоматический поиск файла index.html в репозитории
          FOUND_HTML=$(find . -maxdepth 2 -iname "index.html" | head -n 1)
          if [ -z "$FOUND_HTML" ]; then
            echo "Ошибка: файл index.html не найден в репозитории!"
            exit 1
          fi
          echo "Найден файл: $FOUND_HTML"
          cp "$FOUND_HTML" android-app/app/src/main/assets/index.html

          # Генерируем минимальный AndroidManifest.xml
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.scimacro.nutribadik">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="NutriBadik"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Генерируем MainActivity.kt для WebView
          cat << 'EOF' > android-app/app/src/main/java/com/scimacro/nutribadik/MainActivity.kt
          package com.scimacro.nutribadik
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebSettings
          import android.Manifest
          import android.content.pm.PackageManager
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : Activity() {
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 100)
                  }
                  val webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.databaseEnabled = true
                  webView.settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }
          }
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "NutriBadik"
          include ':app'
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.scimacro.nutribadik'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.scimacro.nutribadik'
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName '3.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.9.0' }
          EOF

          cd android-app
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew assembleDebug

      - name: 4. Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriBadik-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk